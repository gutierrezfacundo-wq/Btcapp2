name: Build apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.2.0.${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report build errors on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          ERRORS=$(grep -nE "^e: |: error:|Unresolved reference|Type mismatch|None of the following|Cannot|FAILURE:|What went wrong" build.log | head -80 || true)
          if [ -z "$ERRORS" ]; then ERRORS="(no se encontraron lineas de error reconocibles; ver tail del log)\n$(tail -60 build.log)"; fi
          BODY=$(printf 'CI Android build errors (sha %s):\n\n```\n%s\n```' "${GITHUB_SHA::7}" "$ERRORS")
          jq -n --arg b "$BODY" '{body:$b}' | \
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -d @-

      - name: Rename APK with version + sha
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REF_NAME="${GITHUB_REF_NAME//\//-}"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/IptvPlayer-${REF_NAME}-${SHA}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IptvPlayer-apk
          path: out/*.apk
          retention-days: 90
          if-no-files-found: error

  webos:
    name: Build webOS IPK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webos/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Stage package contents
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cp appinfo.json icon.png icon_large.png dist/
          # webOS exige exactamente 3 componentes en la version (X.Y.Z),
          # asi que usamos el run_number como patch: 0.2.<run>
          sed -i 's/"version": "0\.2\.0"/"version": "0.2.'"$RUN_NUMBER"'"/' dist/appinfo.json
          echo "Version inyectada:"
          grep version dist/appinfo.json

      - name: Install ares-cli
        run: npm install -g @webosose/ares-cli

      - name: Package .ipk
        run: |
          mkdir -p build
          ares-package dist -o build --no-minify

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IptvPlayer-ipk
          path: webos/build/*.ipk
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, webos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
