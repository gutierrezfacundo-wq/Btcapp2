name: Build apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version + sha
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REF_NAME="${GITHUB_REF_NAME//\//-}"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/IptvPlayer-${REF_NAME}-${SHA}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IptvPlayer-apk
          path: out/*.apk
          retention-days: 90
          if-no-files-found: error

  webos:
    name: Build webOS IPK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webos/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Stage package contents
        run: cp appinfo.json icon.png icon_large.png dist/

      - name: Install ares-cli
        run: npm install -g @webosose/ares-cli

      - name: Package .ipk
        run: |
          mkdir -p build
          ares-package dist -o build --no-minify

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IptvPlayer-ipk
          path: webos/build/*.ipk
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, webos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
